name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"; release=true
          else
            # version comes from <Version> in Directory.Build.props
            v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
            # release automatically when a new version lands on main
            if [ "$GITHUB_REF_NAME" = "main" ] && ! gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release=true
            else
              release=false
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $v, release: $release"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish (self-contained, win-x64)
        run: dotnet publish YtTranscript.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.VERSION }} installer\YtTranscript.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/Output/*.exe

  mac:
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Smoke test (local video file → WAV → Whisper → TXT/SRT)
        if: matrix.rid == 'osx-arm64'
        run: |
          say -o hello.aiff "Hello. This is a short test of the transcription app."
          brew install --quiet ffmpeg
          # a video file with an AAC audio track, like a phone or screen recording
          ffmpeg -loglevel error -f lavfi -i color=c=black:s=320x240:r=10 -i hello.aiff \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac -ac 2 -ar 44100 "test video.mp4"
          # make sure the built-in macOS tools do the conversion, not ffmpeg
          YTTRANSCRIPT_NO_FFMPEG=1 dotnet run --project tests/SmokeTest -c Release -- "$PWD/test video.mp4" test

      - name: Publish (self-contained, ${{ matrix.rid }})
        run: dotnet publish mac/YtTranscript.Mac.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish

      - name: Build .app and .dmg
        run: |
          chmod +x installer/mac/make-dmg.sh
          installer/mac/make-dmg.sh "$VERSION" "${{ matrix.rid }}" publish dist

      - name: Check that the app starts
        if: matrix.rid == 'osx-arm64'
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/yttranscript dist/*.dmg
          "/tmp/yttranscript/YT Transcript.app/Contents/MacOS/YtTranscript" > app.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 $pid 2>/dev/null; then
            echo "App is running"; kill $pid
          else
            echo "::error::App exited on start: $(tr '\n' ' ' < app.log | cut -c1-900)"; exit 1
          fi
          hdiutil detach /tmp/yttranscript

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.rid }}
          path: dist/*.dmg

  release:
    needs: [version, windows, mac]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: YT Transcript ${{ needs.version.outputs.version }}
          files: |
            dist/*.exe
            dist/*.dmg
          generate_release_notes: true
