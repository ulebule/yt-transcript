name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Determine version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
            $release = 'true'
          } else {
            # version comes from <Version> in YtPrepis.csproj
            $v = ([xml](Get-Content YtPrepis.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            # release automatically when a new version lands on main
            gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
            $release = if ($LASTEXITCODE -ne 0 -and $env:GITHUB_REF_NAME -eq 'main') { 'true' } else { 'false' }
          }
          "VERSION=$v" >> $env:GITHUB_ENV
          "RELEASE=$release" >> $env:GITHUB_ENV
          Write-Host "Version $v, release: $release"
          exit 0  # "gh release view" fails when no release exists yet; that is expected

      - name: Publish (self-contained, win-x64)
        run: dotnet publish YtPrepis.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o publish

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.VERSION }} installer\YtPrepis.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: YtPrepis-Setup-${{ env.VERSION }}
          path: installer/Output/*.exe

      - name: GitHub Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: YT Prepis ${{ env.VERSION }}
          files: installer/Output/*.exe
          generate_release_notes: true
